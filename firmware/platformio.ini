; PlatformIO project — ESP32-S3 DevKitC-1, Arduino framework
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    ; h2zero/NimBLE-Arduino        ; stage 1.5 — BLE HID remote
    ; adafruit/Adafruit VEML7700 Library ; stage 1.2 — ambient light
