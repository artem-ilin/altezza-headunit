; PlatformIO project — ESP32-S3 DevKitC-1, Arduino framework
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
; Pinned: an unpinned "espressif32" can update and break the build at any time.
; 6.x = Arduino core 2.0.x. Bump deliberately and record it in docs/decisions.md.
platform = espressif32 @ 6.10.0
board = esp32-s3-devkitc-1
framework = arduino

; Both N8R2 and N16R8 have >= 8 MB flash. default_8MB.csv keeps two OTA slots
; (needed for ArduinoOTA, stage 1.10) and gives each app 3.2 MB.
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; USB: the board definition already sets ARDUINO_USB_MODE=1 (hardware USB-Serial/JTAG).
; CDC_ON_BOOT=1 routes Serial to the native USB port — plug the cable into the
; connector labelled "USB", not "UART". On the "UART" port Serial will be silent.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    ; h2zero/NimBLE-Arduino               ; stage 1.5 — BLE HID remote
    ; adafruit/Adafruit VEML7700 Library  ; stage 1.2 — ambient light
    ; esp32async/ESPAsyncWebServer        ; stage 1.4 — web page (maintained fork)
